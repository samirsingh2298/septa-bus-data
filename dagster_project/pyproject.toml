[project]
name = "septa-dagster"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.26",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[tool.dagster]
module_name = "septa_dagster.definitions"

[tool.setuptools.packages.find]
include = ["septa_dagster*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
