[project]
name = "septa-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["septa_client*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
